<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-labelledby="momentum-title momentum-desc">
  <title id="momentum-title">Velocity directions and force on a stationary vane</title>
  <desc id="momentum-desc">A water jet enters horizontally to the right and a stationary curved vane deflects it downward through angle theta, measured clockwise from the incoming horizontal direction. Blue arrows show inlet and outlet velocity. The outlet speed is unchanged in the ideal model, but its direction changes. Amber arrows show the resulting force on the vane: F x points right and F y points up. The coordinate axes use positive x to the right and positive y upward.</desc>
  <defs>
    <marker id="momentum-velocity-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker>
    <marker id="momentum-force-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#b45309"/></marker>
    <marker id="momentum-axis-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#48617f"/></marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", Arial, sans-serif; font-size: 18px; fill: #233651; }
    .math { font-family: Georgia, "Times New Roman", serif; font-style: italic; font-size: 21px; }
    .sub { font-size: 14px; baseline-shift: sub; }
    .velocity { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#momentum-velocity-arrow); }
    .force { fill: none; stroke: #b45309; stroke-width: 3; marker-end: url(#momentum-force-arrow); }
  </style>
  <rect x="1" y="1" width="478" height="358" rx="16" fill="#eff6ff"/>
  <text x="24" y="29" fill="#48617f">A jet turned downward</text>

  <!-- The jet and the end of the vane both leave at 60 degrees below
       horizontal. Force components have the matching 1:sqrt(3) ratio. -->
  <path d="M32 171H196C227 171 247 189 263 217L306 291.478" fill="none" stroke="#bfdbfe" stroke-width="28"/>
  <path d="M184 144C230 140 257 166 280.32 207L314 265.337" fill="none" stroke="#48617f" stroke-width="9" stroke-linecap="round"/>
  <path d="M54 171H125" class="velocity"/>
  <text x="73" y="145" class="math" style="fill:#2563eb">V<tspan class="sub">in</tspan></text>
  <path d="M275 237.785 310.5 299.273" class="velocity"/>
  <text x="218" y="296" class="math" style="fill:#2563eb">V<tspan class="sub">out</tspan></text>

  <circle cx="238" cy="158" r="4" fill="#b45309"/>
  <path d="M238 158H283" class="force"/>
  <path d="M238 158V80.058" class="force"/>
  <text x="299" y="164" class="math" style="fill:#b45309">F<tspan class="sub">x</tspan></text>
  <text x="226" y="66" class="math" style="fill:#b45309">F<tspan class="sub">y</tspan></text>
  <text x="279" y="94" style="fill:#b45309;font-weight:600">Force on vane</text>

  <path d="M295 272.426H397M306 291.478 322 319.19" stroke="#48617f" stroke-width="1.5" stroke-dasharray="5 5"/>
  <path d="M340 272.426A45 45 0 0 1 317.5 311.398" fill="none" stroke="#48617f" stroke-width="1.7"/>
  <text x="353" y="302" class="math">θ</text>
  <path d="M333 188H302L287 208" fill="none" stroke="#48617f" stroke-width="1.3"/>
  <text x="339" y="194">Vane</text>

  <path d="M53 299V242" fill="none" stroke="#48617f" stroke-width="1.7" marker-end="url(#momentum-axis-arrow)"/>
  <path d="M53 299H113" fill="none" stroke="#48617f" stroke-width="1.7" marker-end="url(#momentum-axis-arrow)"/>
  <text x="121" y="305" class="math">x</text>
  <text x="46" y="233" class="math">y</text>
  <text x="24" y="343" fill="#48617f">Same speed · different direction</text>
</svg>
